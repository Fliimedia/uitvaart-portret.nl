<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beheer – Uitvaart portret</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>
  :root { --bg:#F3EEE6; --card:#FBF8F3; --line:#E2D9CC; --ink:#25292A; --muted:#4A4F4C; --green:#4B5A48; --red:#8A3B2E; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Helvetica Neue',Arial,sans-serif; font-size:16px; line-height:1.5; }
  main { max-width:860px; margin:0 auto; padding:28px 16px 80px; }
  h1 { font-family:Georgia,serif; font-weight:400; font-size:30px; margin:0 0 6px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .top a { color:var(--green); }
  input, select { font:inherit; height:42px; padding:0 12px; border:1px solid #CFC4B4; border-radius:10px; background:#fff; }
  button { font:inherit; height:42px; padding:0 18px; border:0; border-radius:21px; background:var(--green); color:#fff; font-weight:600; cursor:pointer; }
  button.licht { background:#fff; color:var(--ink); border:1px solid #CFC4B4; }
  button:disabled { opacity:.45; cursor:default; }
  .kaart { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:16px; }
  .kop { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .kop h2 { font-family:Georgia,serif; font-weight:400; font-size:22px; margin:0; }
  .code { color:var(--muted); font-size:13px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px; }
  .chip { font-size:13px; padding:3px 10px; border-radius:12px; background:#ECE6DB; color:var(--muted); }
  .chip.ja { background:#DDE5DA; color:#2F3D2C; }
  .rij { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  .uit { margin-top:10px; font-size:14px; word-break:break-all; }
  .uit.fout { color:var(--red); }
  .balk { height:8px; border-radius:4px; background:var(--line); overflow:hidden; flex:1; min-width:120px; }
  .balk div { height:100%; width:0; background:var(--green); }
  details summary { cursor:pointer; color:var(--green); font-weight:600; margin-top:12px; }
  label.kl { font-size:14px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  .tabs { display:flex; gap:8px; margin:0 0 16px; }
  .tabs button { background:#fff; color:var(--ink); border:1px solid #CFC4B4; }
  .tabs button.aan { background:var(--green); color:#fff; border-color:var(--green); }
  textarea { width:100%; font:inherit; font-size:15px; padding:10px 12px; border:1px solid #CFC4B4; border-radius:10px; background:#fff; min-height:220px; }
  .lead.klein { padding:12px 20px; }
  a.wa { display:inline-block; margin-top:6px; padding:8px 16px; border-radius:18px; background:#25D366; color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <div class="top"><div><h1>Beheer</h1><span class="code">Opdrachten, film, concept en betaling</span></div>
    <a href="link.html">Losse uploadlink maken →</a></div>

  <form id="login" class="kaart">
    <label for="ww">Wachtwoord</label>
    <div class="rij"><input id="ww" type="password" autocomplete="current-password" required style="flex:1"><button>Inloggen</button></div>
    <div class="uit fout" id="loginfout"></div>
  </form>
  <div class="tabs" id="tabs" hidden><button type="button" class="aan" data-v="lijst">Films</button><button type="button" data-v="verzamel">Verzamellinks consument</button><button type="button" data-v="ondernemers">Uitvaartondernemers</button><button type="button" data-v="partners">Sales funnel</button></div>
  <div id="lijst"></div>
  <div id="verzamel" hidden></div>
  <div id="ondernemers" hidden></div>
  <div id="partners" hidden></div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let ww = '';
  try { ww = sessionStorage.getItem('beheer-ww') || ''; } catch (e) {}
  const PRIJS = { Klassiek: 249, Modern: 299 };
  const euro = (n) => '€' + (Number.isInteger(n) ? n : n.toFixed(2).replace('.', ','));

  async function api(body) {
    const r = await fetch('/api/beheer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ wachtwoord: ww, ...body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Fout ' + r.status);
    return j;
  }
  const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
  const esc = (s) => String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function toonUit(box, res) {
    box.className = 'uit';
    let h = '';
    if (res.link) h += `Link: <a href="${esc(res.link)}" target="_blank">${esc(res.link)}</a><br>`;
    if (res.href) h += `Betaallink (${euro(res.totaal)}): <a href="${esc(res.href)}" target="_blank">${esc(res.href)}</a><br>`;
    if (res.melding) h += esc(res.melding);
    if (res.verstuurd === 'mail') h += '✓ Gemaild naar de klant.';
    else if (res.wa) h += `Geen e-mailadres bekend. <a class="wa" href="${esc(res.wa)}" target="_blank">Verstuur via WhatsApp</a>`;
    else if (res.tekst) h += 'Geen e-mailadres of 06-nummer bekend. Kopieer deze tekst:<pre style="white-space:pre-wrap">' + esc(res.tekst) + '</pre>';
    box.innerHTML = h;
  }
  const toonFout = (box, e) => { box.className = 'uit fout'; box.textContent = e.message; };

  function kaart(o) {
    const extra = parseInt(o["Extra foto's (boven 60)"], 10) || 0;
    const chip = (label, v) => `<span class="chip ${v ? 'ja' : ''}">${label}${v ? ': ' + esc(v) : ''}</span>`;
    const k = el(`<div class="kaart">
      <div class="kop"><div><h2>${esc(o.Naam || o.Code)}</h2><div class="code">${esc(o.Code)} · ${esc(o.Contact || 'geen contact')}${o['Datum uitvaart'] ? ' · uitvaart ' + esc(o['Datum uitvaart']) : ''}</div></div>
        ${o['Drive-map'] ? `<a href="${esc(o['Drive-map'])}" target="_blank">Drive-map →</a>` : ''}</div>
      <div class="chips">${chip('Upload', o['Upload ontvangen'])}${chip("Foto's", o["Aantal foto's"])}${chip('Akkoord', o['Akkoord voorwaarden'] && o['Akkoord voorwaarden'] !== 'NIET' ? 'ja' : '')}${o.Films && o.Films.includes(' | ') ? chip('Films', o.Films) : ''}${chip('Concept', o.Concept)}${chip('Bedrag', o.Bedrag)}${chip('Betaald', o.Betaald)}${chip('Geleverd', o.Geleverd)}</div>
      <div class="rij"><span><input type="file" accept="video/*" class="film" hidden><button type="button" class="licht kies">1. Film uploaden</button></span>
        <div class="balk"><div></div></div></div>
      <div class="rij"><button type="button" class="concept">2. Concept versturen</button></div>
      <details><summary>3. Betaallink versturen</summary>
        <div class="rij">
          <select class="pakket"><option value="">Pakket…</option><option>Klassiek</option><option>Modern</option></select>
          <select class="spoed"><option value="0">Geen spoed</option><option value="99">Spoed +€99</option></select>
          <label class="kl">Extra rondes <input type="number" class="rondes" min="0" value="0" style="width:64px"></label>
          <label class="kl"><input type="checkbox" class="kort" style="height:auto"> Korte versie +€39</label>
          <label class="kl">Extra films (60%) <input type="number" class="films" min="0" max="5" value="${o.Films ? o.Films.split(' | ').length - 1 : 0}" style="width:64px"></label>
        </div>
        <div class="rij"><span class="totaal code"></span><button type="button" class="betaal">Verstuur betaallink</button></div>
      </details>
      <div class="uit"></div>
    </div>`);
    const uit = k.querySelector('.uit');
    const film = k.querySelector('.film');
    k.querySelector('.kies').onclick = () => film.click();
    film.onchange = async () => {
      const f = film.files[0]; if (!f) return;
      const balk = k.querySelector('.balk div');
      try {
        const { url } = await api({ actie: 'filmStart', code: o.Code, name: f.name, mime: f.type || 'video/mp4', size: f.size });
        await new Promise((ok, nok) => {
          const x = new XMLHttpRequest(); x.open('PUT', url); x.setRequestHeader('Content-Type', f.type || 'video/mp4');
          x.upload.onprogress = (e) => { balk.style.width = (e.loaded / e.total * 100) + '%'; };
          x.onload = () => (x.status < 300 ? ok() : nok(new Error('Upload mislukt (' + x.status + ')')));
          x.onerror = () => nok(new Error('Netwerkfout bij upload')); x.send(f);
        });
        uit.className = 'uit'; uit.textContent = '✓ Film geüpload: ' + f.name + '. Nu kun je het concept versturen.';
      } catch (e) { toonFout(uit, e); }
    };
    const totaalTekst = () => {
      const p = k.querySelector('.pakket').value; if (!p) return '';
      const ef = Math.max(0, +k.querySelector('input.films').value || 0);
      let t = PRIJS[p] + ef * Math.round(PRIJS[p] * 0.6) + Math.ceil(extra / 5) * 10 + (+k.querySelector('.spoed').value) + 35 * (+k.querySelector('.rondes').value || 0) + (k.querySelector('.kort').checked ? 39 : 0);
      return 'Totaal: ' + euro(t) + (ef ? ` (incl. ${ef} extra film${ef > 1 ? 's' : ''})` : '') + (extra ? ` (incl. ${Math.ceil(extra / 5) * 5} extra foto's)` : '') + (o.Download && /^(Betaald|Omzetten|Geleverd)/.test(o.Download) && !o.Partner ? ', min de betaalde download' : '');
    };
    k.querySelectorAll('select, input.rondes, input.kort, input.films').forEach((i) => i.oninput = i.onchange = () => { k.querySelector('.totaal').textContent = totaalTekst(); });
    k.querySelector('.concept').onclick = async (ev) => {
      if (!confirm('Concept naar ' + (o.Naam || o.Code) + ' versturen?')) return;
      ev.target.disabled = true;
      try { toonUit(uit, await api({ actie: 'concept', code: o.Code })); } catch (e) { toonFout(uit, e); }
      ev.target.disabled = false;
    };
    const om = k.querySelector('.omzet');
    if (om) om.onclick = async (ev) => {
      if (!confirm('Alles omzetten en de downloadlink mailen, zonder betaling?')) return;
      ev.target.disabled = true;
      try { toonUit(uit, await api({ actie: 'omzet', code: o.Code })); } catch (e) { toonFout(uit, e); }
      ev.target.disabled = false;
    };
    k.querySelector('.betaal').onclick = async (ev) => {
      const pakket = k.querySelector('.pakket').value;
      if (!pakket) return toonFout(uit, new Error('Kies eerst een pakket'));
      if (!confirm('Betaallink versturen? ' + totaalTekst())) return;
      ev.target.disabled = true;
      try { toonUit(uit, await api({ actie: 'betaal', code: o.Code, pakket, spoed: k.querySelector('.spoed').value,
        extraRondes: k.querySelector('.rondes').value, korteVersie: k.querySelector('.kort').checked, extraFilms: k.querySelector('input.films').value })); } catch (e) { toonFout(uit, e); }
      ev.target.disabled = false;
    };
    return k;
  }

  // ---- Consument: verzamellink zelf aanmaken (iemand appt of belt) ----
  function consumentBlok() {
    const k = el(`<div class="kaart"><div class="kop"><div><h2>Nieuwe verzamellink</h2><div class="code">Voor iemand die je appt of belt: hij of zij krijgt dezelfde mail als via de website (€29, betalen aan het eind).</div></div></div>
      <div class="rij"><input class="c-naam" placeholder="Naam aanvrager" style="flex:1;min-width:180px"><input class="c-mail" type="email" placeholder="E-mailadres" style="flex:1;min-width:200px"></div>
      <div class="rij"><input class="c-voor" placeholder="Voor wie is de film (optioneel)" style="flex:1;min-width:200px"><input class="c-datum" type="date">
        <button type="button" class="c-maak">Maak en mail link</button></div><div class="uit"></div></div>`);
    const uit = k.querySelector('.uit');
    k.querySelector('.c-maak').onclick = async (ev) => {
      ev.target.disabled = true;
      try {
        toonUit(uit, await api({ actie: 'consumentlink', naam: k.querySelector('.c-naam').value, email: k.querySelector('.c-mail').value,
          voor: k.querySelector('.c-voor').value, datum: k.querySelector('.c-datum').value }));
        setTimeout(laad, 1500);
      } catch (e) { toonFout(uit, e); }
      ev.target.disabled = false;
    };
    return k;
  }

  // ---- Partnerlinks: nieuwe link per familie + telling per partner voor de maandfactuur ----
  const PARTNER_PRIJS = 15, GRATIS = 3, EXTRA_FILM = 9.99; // excl. btw per afgeronde link (+ per extra film); eerste 3 per partner helemaal gratis
  function partnerBlok(zelf) {
    const partners = {};
    zelf.filter((o) => o.Partner).forEach((o) => {
      const p = partners[o.Partner] = partners[o.Partner] || { email: o.Contact, totaal: 0, maand: [] };
      if (/^Geleverd/.test(o.Download || '')) {
        p.totaal++;
        const m = /Geleverd (\d{1,2})-(\d{1,2})-(\d{4})/.exec(o.Download);
        const nu = new Date();
        if (m && +m[2] === nu.getMonth() + 1 && +m[3] === nu.getFullYear()) p.maand.push({ code: o.Code, nr: p.totaal, extra: o.Films ? o.Films.split(' | ').length - 1 : 0 });
      }
    });
    const rijen = Object.entries(partners).map(([naam, p]) => {
      const betaald = p.maand.filter((x) => x.nr > GRATIS), tellen = betaald.length, ef = betaald.reduce((a, x) => a + x.extra, 0);
      const bedrag = Math.round((tellen * PARTNER_PRIJS + ef * EXTRA_FILM) * 100) / 100;
      return `<tr><td>${esc(naam)}</td><td>${p.maand.length} deze maand</td><td>${tellen ? tellen + ' × €' + PARTNER_PRIJS + (ef ? ' + ' + ef + ' extra film' + (ef > 1 ? 's' : '') + ' × €9,99' : '') + ' = ' + euro(bedrag) + ' excl. btw' : 'nog gratis'}</td><td class="code">${p.totaal} totaal</td></tr>`;
    }).join('');
    const k = el(`<div class="kaart"><div class="kop"><div><h2>Nieuwe partnerlink</h2><div class="code">Voor een uitvaartondernemer: per familie een link, zonder betaalstap. De eerste ${GRATIS} per partner gratis, daarna €${PARTNER_PRIJS} excl. btw per afgeronde link (+ €9,99 per extra film) op de maandfactuur.</div></div></div>
      <div class="rij"><input class="p-naam" list="p-lijst" placeholder="Partner, bijv. Mare Uitvaartbegeleiding" style="flex:1;min-width:220px"><datalist id="p-lijst">${Object.keys(partners).map((n) => `<option value="${esc(n)}">`).join('')}</datalist>
        <input class="p-mail" type="email" placeholder="E-mailadres partner" style="flex:1;min-width:200px"></div>
      <div class="rij"><input class="p-fam" placeholder="Familie, bijv. Familie De Vries" style="flex:1;min-width:200px"><input class="p-datum" type="date">
        <button type="button" class="p-maak">Maak en mail link</button></div>
      ${rijen ? `<table style="width:100%;margin-top:12px;font-size:15px;border-collapse:collapse"><tr class="code"><td>Partner</td><td>Afgerond</td><td>Te factureren</td><td></td></tr>${rijen}</table>` : ''}
      <div class="uit"></div></div>`);
    const uit = k.querySelector('.uit');
    k.querySelector('.p-naam').oninput = (e) => { const p = partners[e.target.value]; if (p && !k.querySelector('.p-mail').value) k.querySelector('.p-mail').value = p.email; };
    k.querySelector('.p-maak').onclick = async (ev) => {
      ev.target.disabled = true;
      try {
        toonUit(uit, await api({ actie: 'partnerlink', partner: k.querySelector('.p-naam').value, email: k.querySelector('.p-mail').value,
          familie: k.querySelector('.p-fam').value, datum: k.querySelector('.p-datum').value }));
        setTimeout(laad, 1500);
      } catch (e) { toonFout(uit, e); }
      ev.target.disabled = false;
    };
    return k;
  }

  // ---- Verzamellinks (zelf maken) ----
  function vKaart(o) {
    const chip = (label, v) => `<span class="chip ${v ? 'ja' : ''}">${label}${v ? ': ' + esc(v) : ''}</span>`;
    const d = o.Download || '';
    const k = el(`<div class="kaart">
      <div class="kop"><div><h2>${esc(o.Naam || o.Code)}</h2><div class="code">${esc(o.Code)} · ${esc(o.Contact || 'geen contact')}${o['Datum uitvaart'] ? ' · uitvaart ' + esc(o['Datum uitvaart']) : ''}</div></div>
        ${o['Drive-map'] ? `<a href="${esc(o['Drive-map'])}" target="_blank">Drive-map →</a>` : ''}</div>
      <div class="chips">${o.Partner ? chip('Partner', o.Partner) : ''}${chip('Aangevraagd', (o.Aanvraag || '').replace(/ \(.*\)$/, ''))}${chip('Laatste upload', o['Upload ontvangen'])}${chip("Foto's", o["Aantal foto's"])}${o.Films && o.Films.includes(' | ') ? chip('Films', o.Films) : ''}${chip('Download', d)}</div>
      <div class="rij"><a href="${esc(o.Beheerlink || '#')}" target="_blank" class="licht" style="text-decoration:none;padding:10px 18px;border:1px solid #CFC4B4;border-radius:22px">Verzamelpagina van de klant →</a>
        ${o.Uploadlink ? `<a href="${esc(o.Uploadlink)}" target="_blank" class="code">Uploadlink</a>` : ''}</div>
      <div class="rij"><button type="button" class="licht omzet">${/^Geleverd/.test(d) ? 'Opnieuw omzetten en mailen' : 'Omzetten zonder betaling'}</button>
        <button type="button" class="licht film">Wordt een film → naar Films</button></div>
      <div class="uit"></div></div>`);
    const uit = k.querySelector('.uit');
    k.querySelector('.omzet').onclick = async (ev) => {
      if (!confirm('Alles omzetten en de downloadlink mailen, zonder betaling?')) return;
      ev.target.disabled = true;
      try { toonUit(uit, await api({ actie: 'omzet', code: o.Code })); } catch (e) { toonFout(uit, e); }
      ev.target.disabled = false;
    };
    k.querySelector('.film').onclick = async (ev) => {
      if (!confirm('Laat deze familie de film door jou maken? De opdracht gaat naar het tabblad Films; een betaalde download wordt verrekend.')) return;
      ev.target.disabled = true;
      try { await api({ actie: 'naarFilm', code: o.Code }); laad(); } catch (e) { toonFout(uit, e); ev.target.disabled = false; }
    };
    return k;
  }

  async function laad() {
    $('lijst').innerHTML = '<p class="code">Laden…</p>';
    try {
      const { lijst } = await api({ actie: 'lijst' });
      $('login').hidden = true; $('tabs').hidden = false;
      const zelf = lijst.filter((o) => o.Pakket === 'Zelf maken'), films = lijst.filter((o) => o.Pakket !== 'Zelf maken');
      $('lijst').innerHTML = films.length ? '' : '<p class="code">Nog geen filmopdrachten.</p>';
      films.forEach((o) => $('lijst').appendChild(kaart(o)));
      const cons = zelf.filter((o) => !o.Partner), part = zelf.filter((o) => o.Partner);
      $('verzamel').innerHTML = '';
      $('verzamel').appendChild(consumentBlok());
      $('verzamel').appendChild(el(cons.length ? `<p class="code">${cons.length} verzamellink(s) van particulieren. Status: aangevraagd → uploads → betaald → omgezet → geleverd.</p>` : '<p class="code">Nog geen verzamellinks van particulieren.</p>'));
      cons.forEach((o) => $('verzamel').appendChild(vKaart(o)));
      $('ondernemers').innerHTML = '';
      $('ondernemers').appendChild(partnerBlok(zelf));
      $('ondernemers').appendChild(el(part.length ? `<p class="code">${part.length} partnerlink(s).</p>` : '<p class="code">Nog geen partnerlinks.</p>'));
      part.forEach((o) => $('ondernemers').appendChild(vKaart(o)));
      document.querySelector('#tabs [data-v="verzamel"]').textContent = 'Verzamellinks consument' + (cons.length ? ` (${cons.length})` : '');
      document.querySelector('#tabs [data-v="ondernemers"]').textContent = 'Uitvaartondernemers' + (part.length ? ` (${part.length})` : '');
    } catch (e) {
      $('lijst').innerHTML = ''; $('login').hidden = false; $('loginfout').textContent = e.message;
    }
  }
  // ---- Partners (uitvaartondernemers) ----
  async function papi(body) {
    const r = await fetch('/api/partners', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ wachtwoord: ww, ...body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Fout ' + r.status);
    return j;
  }
  const STATUSSEN = ['', 'Gereageerd', 'Partner', 'Geen interesse', 'Bellen', 'Afgemeld'];
  function leadKaart(l) {
    const stand = ['Mail 1', 'Mail 2', 'Mail 3'].filter((m) => l[m]).map((m) => m + ': ' + l[m]).join(' · ') || 'nog niet gemaild';
    const k = el(`<div class="kaart lead ${l.stap ? '' : 'klein'}">
      <div class="kop"><div><h2>${esc(l.Bedrijf)}</h2><div class="code">${esc(l.Contactpersoon || '')}${l.Contactpersoon ? ' · ' : ''}${esc(l.Plaats)} · ${esc(l['E-mail'] || 'geen e-mail')}${l.Website ? ` · <a href="${esc(l.Website)}" target="_blank">site</a>` : ''}</div></div>
        <select class="st">${STATUSSEN.map((s) => `<option ${s === l.Status ? 'selected' : ''} value="${s}">${s || 'Status…'}</option>`).join('')}</select></div>
      <div class="chips"><span class="chip">${esc(stand)}</span>${l.stap ? `<span class="chip ja">Mail ${l.stap} staat klaar</span>` : ''}</div>
      ${l.stap ? `<input class="ond" style="width:100%" value="${esc(l.onderwerp)}"><div style="height:8px"></div><textarea class="tk">${esc(l.tekst)}</textarea>
      <div class="rij"><button type="button" class="licht tst">Testmail naar mezelf</button><button type="button" class="vs">Verstuur mail ${l.stap}</button><span class="code">Onder de mail komen automatisch je adres en een afmeldlink.</span></div>` : ''}
      <div class="uit"></div></div>`);
    const uit = k.querySelector('.uit');
    k.querySelector('.st').onchange = async (ev) => {
      try { await papi({ actie: 'status', rij: l.rij, status: ev.target.value }); uit.className = 'uit'; uit.textContent = '✓ Status opgeslagen'; } catch (e) { toonFout(uit, e); }
    };
    const vs = k.querySelector('.vs');
    if (vs) {
      k.verstuur = async () => {
        vs.disabled = true;
        try {
          await papi({ actie: 'verstuur', rij: l.rij, stap: l.stap, onderwerp: k.querySelector('.ond').value, tekst: k.querySelector('.tk').value });
          uit.className = 'uit'; uit.textContent = '✓ Verstuurd naar ' + l['E-mail']; k.querySelector('.tk').disabled = true; k.querySelector('.ond').disabled = true;
          return true;
        } catch (e) { toonFout(uit, e); vs.disabled = false; return false; }
      };
      k.querySelector('.tst').onclick = async (ev) => {
        ev.target.disabled = true;
        try { const r = await papi({ actie: 'test', rij: l.rij, onderwerp: k.querySelector('.ond').value, tekst: k.querySelector('.tk').value });
          uit.className = 'uit'; uit.textContent = '✓ Testmail verstuurd naar ' + r.naar + '. Er is niets naar ' + l.Bedrijf + ' gegaan.'; } catch (e) { toonFout(uit, e); }
        ev.target.disabled = false;
      };
      vs.onclick = () => { if (confirm('Mail ' + l.stap + ' naar ' + l.Bedrijf + ' versturen?')) k.verstuur(); };
    }
    return k;
  }
  async function laadPartners() {
    const box = $('partners');
    box.innerHTML = '<p class="code">Laden…</p>';
    try {
      const { lijst, bron, sheet } = await papi({ actie: 'lijst' });
      const klaar = lijst.filter((l) => l.stap);
      box.innerHTML = `<div class="kaart"><div class="kop"><div><h2>Uitvaartondernemers</h2>
        <div class="code">${lijst.length} leads · ${klaar.length} mails staan klaar · teksten: ${esc(bron)}</div></div><a href="${esc(sheet)}" target="_blank">Leadlijst openen →</a></div>
        ${klaar.length ? `<div class="rij"><button type="button" id="alles">Verstuur alle ${klaar.length} klaarstaande mails</button><span class="code" id="voortgang">Eén mail per 20 seconden, zodat het niet als bulk binnenkomt.</span></div>` : ''}</div>`;
      const kaarten = lijst.sort((a, b) => (b.stap > 0) - (a.stap > 0)).map(leadKaart);
      kaarten.forEach((k) => box.appendChild(k));
      const alles = $('alles');
      if (alles) alles.onclick = async () => {
        const rij = kaarten.filter((k) => k.verstuur);
        if (!confirm(rij.length + ' mails versturen? Controleer de teksten eerst. Dit duurt ongeveer ' + Math.ceil(rij.length / 3) + ' minuten; laat dit venster open.')) return;
        alles.disabled = true;
        for (let i = 0; i < rij.length; i++) {
          $('voortgang').textContent = `Bezig: ${i + 1} van ${rij.length}…`;
          if (!(await rij[i].verstuur())) { $('voortgang').textContent = `Gestopt bij ${i + 1}: zie de foutmelding bij die lead.`; alles.disabled = false; return; }
          if (i < rij.length - 1) await new Promise((r) => setTimeout(r, 20000));
        }
        $('voortgang').textContent = '✓ Alle ' + rij.length + ' mails verstuurd.';
      };
    } catch (e) { box.innerHTML = ''; toonFout(box, e); }
  }
  document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => {
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('aan', x === b));
    ['lijst', 'verzamel', 'ondernemers', 'partners'].forEach((v) => { $(v).hidden = b.dataset.v !== v; });
    if (b.dataset.v === 'partners') laadPartners();
  });

  $('login').onsubmit = (e) => { e.preventDefault(); ww = $('ww').value; try { sessionStorage.setItem('beheer-ww', ww); } catch (er) {} laad(); };
  if (ww) laad();
})();
</script>
